<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jento Social</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #0F766E;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      background: #0F766E;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #0d655d;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Jento Social Automator</h2>
  
  <div id="setup-view">
    <p style="font-size: 13px; color: #666; margin-bottom: 16px;">
      Enter your Jento API Key to connect this extension to your workspace.
    </p>
    <div class="form-group">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="jen_xxxxxxxxxxxxx">
    </div>
    <button id="save-btn">Connect to Jento</button>
  </div>

  <div id="status-msg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
