[project]
name = "worker-http"
version = "0.1.0"
dependencies = [
    "httpx",
    "boto3",
    "beautifulsoup4",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "asyncio"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["../../packages/extractor-core", "../../packages/domain-normalizer"]
