<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JentoAI Outreach</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #f9fafb;
      color: #111827;
    }
    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: #e0e7ff;
      color: #4f46e5;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #4338ca;
    }
    .hidden {
      display: none;
    }
    #status {
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
      color: #10b981;
    }
    .error {
      color: #ef4444 !important;
    }
    .info {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h2>JentoAI <span class="badge">PRO</span></h2>
  
  <div id="login-section">
    <div class="info">Log in to sync leads directly to your JentoAI CRM and automate DMs.</div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="agent@jentoai.pro">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button id="login-btn">Log In</button>
  </div>

  <div id="main-section" class="hidden">
    <div class="info">Connected! Open a Facebook or Instagram profile to capture the lead and send an automated DM.</div>
    
    <div class="input-group">
      <label>Active Campaign (Templates)</label>
      <select id="campaign-select" style="width:100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
        <option value="">Loading...</option>
      </select>
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 16px 0;">

    <div class="info" style="margin-bottom: 8px;"><strong>LinkedIn Auto-Pilot</strong></div>
    <div class="info" style="font-size: 11px;">Settings and limits are managed from your CRM Dashboard. The extension runs in the background.</div>

    <button id="start-auto-btn" style="background: #10b981; margin-bottom: 12px;">Start Background Worker</button>
    
    <button id="logout-btn" style="background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;">Log Out</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
